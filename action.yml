name: 'Setup Go with Isolated Cache'
description: 'Install Go and cache GOCACHE/GOMODCACHE with per-job isolation, branch-aware restore, and working-set trimming.'
author: 'step-security'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  cache-key-prefix:
    description: 'Prefix for the cache key to prevent collisions between jobs that build different things'
    required: true
  go-version:
    description: 'The Go version to download (if necessary) and use.'
    required: true
  cache-dependency-path:
    description: 'Glob hashed into the cache key. Use a single glob; defaults to go.sum files.'
    required: false
    default: '**/go.sum'
  max-staleness-hours:
    description: 'Whole hours to retain GOCACHE entries before the job start time.'
    required: false
    default: '2'

outputs:
  cache-hit:
    description: 'True if an exact cache key match was restored'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        # validate subscription status
        UPSTREAM="cloudx-io/setup-go"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash
    - name: install go binary
      id: install-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    - name: get cache paths
      id: get-cache-paths
      shell: bash
      run: |
        echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - name: cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.get-cache-paths.outputs.gocache }}
          ${{ steps.get-cache-paths.outputs.gomodcache }}
        key: go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles(inputs.cache-dependency-path) }}-${{ github.run_id }}
        restore-keys: |
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles(inputs.cache-dependency-path) }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.head_ref || github.ref_name }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.event.repository.default_branch }}-${{ hashFiles(inputs.cache-dependency-path) }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.event.repository.default_branch }}-
    # Trim GOCACHE to this run's working set. This action's post-hook runs
    # in reverse declaration order: after the consumer workflow's main steps
    # populate the cache, and before actions/cache's post-save uploads it.
    # Without this, every save accretes another layer of stale compile
    # outputs (Go has no GOCACHEMAXSIZE knob, and its 5-day age trim never
    # fires anything in CI that compiles daily). Go touches mtimes on cache
    # use, so entries untouched since job start went unused this run and
    # are dropped.
    #
    # $/trim-gocache resolves to this repository at the same SHA the caller
    # pinned. A workspace-relative path like ./.github/actions/... only works
    # when the action lives in the consumer repo.
    - name: trim GOCACHE
      uses: $/trim-gocache
      with:
        gocache: ${{ steps.get-cache-paths.outputs.gocache }}
        max-staleness-hours: ${{ inputs.max-staleness-hours }}
